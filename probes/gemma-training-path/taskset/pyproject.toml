[project]
name = "gemma-training-proof"
version = "0.1.0"
description = "Disposable stateful tool-use taskset for the Gemma training-path smoke test."
requires-python = ">=3.11,<3.14"
dependencies = ["verifiers"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gemma_training_proof"]
