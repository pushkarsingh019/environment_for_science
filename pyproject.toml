[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "science-environment-studio"
version = "0.1.0"
description = "Local deterministic runtime for simulated science Environments"
requires-python = ">=3.9"
dependencies = [
  "anyio>=3.6.2,<4.12",
  "click>=8.1,<8.2",
  "eval-type-backport>=0.2,<1; python_version < '3.10'",
  "fastapi>=0.115,<0.116",
  "jsonschema>=4.23,<4.26",
  "pydantic>=2.10,<3",
  "uvicorn>=0.34,<0.35",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "mypy>=1.14,<2",
  "pytest>=8.3,<9",
  "ruff>=0.9,<1",
  "types-jsonschema>=4.23,<5",
]

[tool.hatch.build.targets.wheel]
packages = ["studio", "environments"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.9"
strict = true
packages = ["studio", "environments"]
